<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
        }

        .button-container {
            display: flex;
            gap: 20px;
        }

        .btn {
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .btn:hover {
            transform: translateY(-2px);
            opacity: 0.9;
        }

        /* Colori dei bottoni */
        .btn-ahyeon {
            background-color: #8A2BE2; /* Viola */
        }

        .btn-asa {
            background-color: #2E8B57; /* Verde */
        }

        .btn-jennie {
            background-color: #1E90FF; /* Blu */
        }
    </style>
</head>
<body>

    <h1>Benvenuto nel mio sito web</h1>

    <div class="button-container">
        <!-- Bottone Ahyeon (Viola) -->
        <button class="btn btn-ahyeon" onclick="location.href='ahyeon.html'">Ahyeon</button>
        
        <!-- Bottone Asa (Verde) -->
        <button class="btn btn-asa" onclick="location.href='asa.html'">Asa</button>
        
        <!-- Bottone Jennie (Blu) -->
        <button class="btn btn-jennie" onclick="location.href='jennie.html'">Jennie</button>
    </div>

</body>
</html>
