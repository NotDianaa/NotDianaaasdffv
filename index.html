<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Home Page</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background-color: #000000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            color: white;
            padding: 30px 0;
        }
        h1 {
            margin-bottom: 30px;
        }
        .sections-container {
            display: flex;
            gap: 50px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }
        .section-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .btn {
            padding: 12px 25px;
            font-size: 16px;
            font-weight: bold;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            width: 140px;
            text-align: center;
            display: inline-block;
            cursor: pointer;
            border: none;
        }
        .btn-ahyeon { background-color: #8A2BE2; }
        .btn-asa { background-color: #2E8B57; }
        .btn-jennie { background-color: #1E90FF; }
        .btn-lisa { background-color: #FF1493; }
        .btn-wonyoung { background-color: #FF8C00; }
        .btn-jisoo { background-color: #DC143C; }
        .btn-rose { background-color: #FF69B4; }
        
        .btn:hover {
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <h1>Benvenuto nel mio sito web</h1>

    <div class="sections-container">
        
        <!-- Sezione Instagram -->
        <div class="section">
            <span class="section-title">Instagram</span>
            <button class="btn btn-ahyeon" onclick="window.open('https://www.instagram.com/ahyeon.bm.private', '_blank')">Ahyeon</button>
            <button class="btn btn-asa" onclick="window.open('https://www.instagram.com/asa_mbbmprv.__?utm_source=ig_web_button_share_sheet&igsh=ZDNlZDc0MzIxNw==', '_blank')">Asa</button>
            <button class="btn btn-jennie" onclick="window.open('https://www.instagram.com/jennie_kim_blk_?utm_source=ig_web_button_share_sheet&igsh=ZDNlZDc0MzIxNw==', '_blank')">Jennie</button>
            <button class="btn btn-lisa" onclick="window.open('https://www.instagram.com/lisa_lalisablk?utm_source=ig_web_button_share_sheet&igsh=ZDNlZDc0MzIxNw==', '_blank')">Lisa</button>
            <button class="btn btn-wonyoung" onclick="window.open('https://www.instagram.com/wonyoung.ivie.priv.jangs?utm_source=ig_web_button_share_sheet&igsh=ZDNlZDc0MzIxNw==', '_blank')">Wonyoung</button>
            <button class="btn btn-jisoo" onclick="window.open('https://www.instagram.com/jisoou.blk.priv?utm_source=ig_web_button_share_sheet&igsh=ZDNlZDc0MzIxNw==', '_blank')">Jisoo</button>
            <button class="btn btn-rose" onclick="window.open('https://www.instagram.com/rosieandrosepriv.blk.hb', '_blank')">Rosé</button>
        </div>

        <!-- Sezione Discord -->
        <div class="section">
            <span class="section-title">Discord</span>
            <button class="btn btn-ahyeon" onclick="navigator.clipboard.writeText('hoshinoai_official_ds'); alert('Copiato: hoshinoai_official_ds');">Ahyeon</button>
            <button class="btn btn-asa" onclick="navigator.clipboard.writeText('__asaaa_babymonster__'); alert('Copiato: __asaaa_babymonster__');">Asa</button>
            <button class="btn btn-jennie" onclick="navigator.clipboard.writeText('je_nnierubyjane_'); alert('Copiato: je_nnierubyjane_');">Jennie</button>
            <button class="btn btn-lisa" onclick="navigator.clipboard.writeText('lalisa_man.'); alert('Copiato: lalisa_man.');">Lisa</button>
            <button class="btn btn-wonyoung" onclick="navigator.clipboard.writeText('wonyoung.lock'); alert('Copiato: wonyoung.lock');">Wonyoung</button>
            <button class="btn btn-jisoo" onclick="navigator.clipboard.writeText('jisooblk_'); alert('Copiato: jisooblk_');">Jisoo</button>
            <button class="btn btn-rose" onclick="navigator.clipboard.writeText('rose_blk_official_private'); alert('Copiato: rose_blk_official_private');">Rosé</button>
        </div>

    </div>

</body>
</html>
